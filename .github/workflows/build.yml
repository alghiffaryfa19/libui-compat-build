name: Build libui compatibility layer

on:
  workflow_dispatch:
    inputs:
      android_api:
        description: Android SDK/API level used to select the minimal manifest
        required: true
        default: '35'
      libhybris_ref:
        description: Linux-on-droid/libhybris branch, tag, or commit
        required: true
        default: lindroid-21
      lunch_target:
        description: Android lunch target
        required: true
        default: aosp_arm64-trunk_staging-userdebug
      runner:
        description: Runner label; use a larger or self-hosted runner when possible
        required: true
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: libui-compat-api-${{ inputs.android_api }}-${{ inputs.libhybris_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      ANDROID_API: ${{ inputs.android_api }}
      LIBHYBRIS_REF: ${{ inputs.libhybris_ref }}
      LUNCH_TARGET: ${{ inputs.lunch_target }}
      DIST_DIR: ${{ github.workspace }}/dist
      MIN_FREE_GIB: 55
      REPO_SYNC_TIMEOUT: 90m
      BUILD_TIMEOUT: 240m

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk and report capacity
        run: |
          df -h
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df -h

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex g++-multilib gcc-multilib \
            git git-lfs libelf-dev liblz4-tool libssl-dev libxml2-utils \
            lz4 lzop pngcrush python3-yaml repo rsync squashfs-tools \
            xsltproc zip zlib1g-dev

      - name: Validate repository
        run: bash tests/test-repo.sh

      - name: Build libui_compat_layer.so
        run: |
          printf 'ANDROID_API=%s MIN_FREE_GIB=%s REPO_SYNC_TIMEOUT=%s BUILD_TIMEOUT=%s\n' \
            "$ANDROID_API" "$MIN_FREE_GIB" "$REPO_SYNC_TIMEOUT" "$BUILD_TIMEOUT"
          scripts/build.sh

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libui-compat-${{ github.run_id }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
